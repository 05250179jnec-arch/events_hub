<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNEC Events Hub - Contact</title>

    <!-- 1. Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 2. Font Awesome (icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- 3. YOUR CSS (last to override Bootstrap) -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header id="top">
        <h1>JNEC Events Hub</h1>
        <nav>
            <a href="index.html" title="Go to home page">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <div class="container py-4">

            <h2 class="mb-4">Contact Us</h2>

            <div class="row g-4">

                <!-- LEFT COLUMN: Contact Info Card with Icons -->
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="fa-solid fa-location-dot text-danger"></i> Address
                            </h5>
                            <p class="card-text">Jigme Namgyel Engineering College, Dewathang, Bhutan</p>

                            <h5 class="card-title mt-4">
                                <i class="fa-solid fa-envelope text-primary"></i> Email
                            </h5>
                            <p class="card-text">
                                <a href="mailto:05250179@jnec.edu.bt">05250179@jnec.edu.bt</a>
                            </p>

                            <h5 class="card-title mt-4">
                                <i class="fa-solid fa-phone text-success"></i> Phone
                            </h5>
                            <p class="card-text">+975 77406154</p>
                        </div>
                    </div>
                </div>

                <!-- RIGHT COLUMN: Framed Map -->
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="fa-solid fa-map"></i> Our Location
                            </h5>
                            <iframe 
                                src="https://www.google.com/maps?q=Jigme+Namgyel+Engineering+College&output=embed"
                                style="width:100%; height:250px; border:2px solid #ddd; border-radius:8px;"
                                title="Campus map"
                                allowfullscreen>
                            </iframe>
                        </div>
                    </div>
                </div>

            </div> <!-- /row -->

            <!-- Enquiry Form with Bootstrap Classes -->
            <h2 class="mt-5 mb-3">Enquiry Form</h2>
            <div class="card">
                <div class="card-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea rows="4" class="form-control"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>

        </div> <!-- /container -->
    </main>

    <footer>
        <p>&copy; 2026 JNEC Events Hub</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
